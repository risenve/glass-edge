<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Края в фокусе</title>
<style>
/* Dark full-bleed stage; compact tweak panel floats top-right (bottom sheet on phones). */
:root{
  --stage:#0C0C0E; --panel:#2A2A2E; --folder:#232326; --row:#2F2F33; --fg:#C9CAD1; --muted:#8C8D96;
  --ctl:#3A3A3F; --ctl-hi:#45454B; --knob:#B8B9C1; --btn:#ADAFB8; --btn-fg:#1C1C1F; --accent:#91E2FF;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--mono);font-size:12px;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{position:relative}
.wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.stage.dragging::after{content:"";position:absolute;inset:12px;border:1px dashed var(--muted);border-radius:8px;pointer-events:none}

.pane{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;background:var(--panel);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:4px 0 6px;scrollbar-width:thin}
.fold{margin:2px 0}
.fh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--fg);font:inherit;font-size:12.5px;padding:7px 10px;cursor:pointer;text-align:left}
.fh::after{content:"";width:6px;height:10px;border-radius:3px;border:1.5px solid var(--muted);opacity:.8}
.fold.closed .fh::after{height:6px}
.fb{background:var(--folder);padding:3px 0;display:grid}
.fold.closed .fb{display:none}
.r{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;padding:3px 8px 3px 10px;min-height:26px}
.r>span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ctl-hi);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--ctl-hi);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:14px;border-radius:3px;background:var(--knob);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:14px;border-radius:3px;background:var(--knob);border:0}
input[type=number],select{font:inherit;color:var(--fg);background:var(--ctl);border:0;border-radius:3px;height:22px;width:100%;padding:0 6px;box-sizing:border-box}
input[type=number]{text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
select{background:var(--btn);color:var(--btn-fg);font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--btn-fg) 50%),linear-gradient(135deg,var(--btn-fg) 50%,transparent 50%);
  background-position:calc(100% - 12px) 9px,calc(100% - 8px) 9px;background-size:4px 4px;background-repeat:no-repeat;padding-right:22px}
button.b{font:inherit;font-weight:600;color:var(--btn-fg);background:var(--btn);border:0;border-radius:3px;height:22px;padding:0 8px;cursor:pointer;width:100%}
button.b:hover,select:hover{filter:brightness(1.08)}
button.b:active{filter:brightness(.92)}
.r.dim{opacity:.35;pointer-events:none}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.meta{color:var(--muted);padding:2px 10px 4px;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1}
@media (max-width:760px){
  .pane{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46%;border-radius:10px 10px 0 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .stage{bottom:46%}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="wrap" id="wrap"><canvas id="view"></canvas><canvas id="ov"></canvas></div>
</div>
<div class="pane" id="pane"></div>
<input id="file" type="file" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const S={aspect:'1x1',zoom:120,panx:0,pany:0,
  shape:'ellipse',clear:46,feather:40,blur:60,magnify:8,gloss:28,darken:12,
  fmt:'png',q:92,preset:'orig'};
const MAXSIDE=3200,OUTLONG=1600;
const $=id=>document.getElementById(id);
const mk=()=>document.createElement('canvas');
const view=$('view'),ov=$('ov'),wrap=$('wrap'),stage=$('stage'),pane=$('pane');
const srcC=mk(),cropC=mk(),blurC=mk(),maskC=mk(),tmpC=mk();
const ctx=c=>c.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let sw=0,sh=0,W=0,H=0,fileBase='photo';
let dlP=null;try{dlP=window.claude&&window.claude.use?window.claude.use('downloads'):null}catch(e){dlP=null}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

// ---------- sample: colorful bookshelf ----------
function sample(){const c=mk();c.width=1600;c.height=1600;const g=ctx(c);g.fillStyle='#2A2018';g.fillRect(0,0,1600,1600);
  const cols=['#7C3B2E','#B5582F','#C79A3A','#4E6B3A','#355E6B','#45386B','#7A3157','#8A8A82','#C2B8A5','#5A4632'];
  const shelfH=1600/5;for(let s=0;s<5;s++){const y0=s*shelfH;g.fillStyle='#3A2C20';g.fillRect(0,y0+shelfH-18,1600,18);
    let x=10;while(x<1590){const w=28+((Math.sin(x*12.9+s*7)*0.5+0.5)*44);const h=shelfH-28-((Math.sin(x*3.1+s)*0.5+0.5)*30);const col=cols[(x*7+s*3|0)%cols.length];
      g.fillStyle=col;g.fillRect(x,y0+shelfH-18-h,w,h);g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x,y0+shelfH-18-h,w,6);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+w-4,y0+shelfH-18-h,4,h);x+=w+5}}
  return c}

// ---------- image io ----------
function recalc(){if(!sw)return;let a;if(S.aspect==='orig')a=sw/sh;else{const [aw,ah]=S.aspect.split('x').map(Number);a=aw/ah}
  if(a>=1){W=OUTLONG;H=Math.round(OUTLONG/a)}else{H=OUTLONG;W=Math.round(OUTLONG*a)}
  for(const c of [cropC,blurC,maskC,tmpC,view,ov]){c.width=W;c.height=H}
  const m=$('meta');if(m)m.textContent=sw+'×'+sh+'  →  '+W+'×'+H;fit();schedule()}
function setImage(img,name){let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const k=Math.min(1,MAXSIDE/Math.max(w,h));sw=Math.round(w*k);sh=Math.round(h*k);
  srcC.width=sw;srcC.height=sh;ctx(srcC).drawImage(img,0,0,sw,sh);if(name)fileBase=name.replace(/\.[^.]+$/,'').slice(0,60)||'photo';recalc()}
function loadFile(f){if(!f||!f.type.startsWith('image/')){toast('Нужен JPG, PNG или WebP');return}
  const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{setImage(im,f.name);URL.revokeObjectURL(url)};im.onerror=()=>toast('Файл не открылся (HEIC → JPG)');im.src=url}
$('file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value=''});
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('dragging')});
stage.addEventListener('dragleave',()=>stage.classList.remove('dragging'));
stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});
window.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)loadFile(it.getAsFile())});
function fit(){if(!W)return;const r=stage.getBoundingClientRect();const wide=window.innerWidth>760;const padR=wide?pane.offsetWidth+36:16,padL=wide?36:16,padY=wide?36:16;
  const s=Math.min((r.width-padL-padR)/W,(r.height-padY*2)/H);wrap.style.width=Math.max(40,W*s)+'px';wrap.style.height=Math.max(40,H*s)+'px';wrap.style.marginRight=wide?(padR-padL)+'px':'0'}
new ResizeObserver(fit).observe(stage);

// ---------- geometry ----------
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function clearPath(g,scale){const cx=W/2,cy=H/2;scale=scale||1;
  if(S.shape==='rect'){const w=S.clear/100*W*scale,h=S.clear/100*H*scale,rad=Math.min(w,h)*0.28;rr(g,cx-w/2,cy-h/2,w,h,rad)}
  else{const base=Math.min(W,H)/2;const r=S.clear/100*base*scale;const sx=S.shape==='ellipse'?W/Math.min(W,H):1,sy=S.shape==='ellipse'?H/Math.min(W,H):1;
    g.save();g.translate(cx,cy);g.scale(sx,sy);g.beginPath();g.arc(0,0,r,0,7);g.closePath();g.restore()}}

// ---------- build layers ----------
function buildCrop(){const g=ctx(cropC);g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalAlpha=1;g.clearRect(0,0,W,H);
  const s=Math.max(W/sw,H/sh)*S.zoom/100;const dw=sw*s,dh=sh*s;const ox=(W-dw)/2+S.panx/100*(dw-W)/2,oy=(H-dh)/2+S.pany/100*(dh-H)/2;
  g.imageSmoothingQuality='high';g.drawImage(srcC,ox,oy,dw,dh)}
function buildBlur(){const g=ctx(blurC);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.clearRect(0,0,W,H);g.save();
  const px=S.blur/100*Math.min(W,H)*0.06;if(px>0)g.filter=`blur(${px}px)`;g.drawImage(cropC,0,0);g.restore();
  if(S.darken>0){g.save();g.globalAlpha=S.darken/100;g.fillStyle='#000';g.fillRect(0,0,W,H);g.restore()}}
function buildMask(){const g=ctx(maskC);g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.filter='none';g.clearRect(0,0,W,H);g.save();
  const base=Math.min(W,H)/2;const fb=Math.max(0.5,S.feather/100*base*0.9);g.filter=`blur(${fb}px)`;g.fillStyle='#fff';clearPath(g);g.fill();g.restore()}
function render(){if(!W)return;buildCrop();buildBlur();buildMask();
  const g=ctx(view);g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.filter='none';g.clearRect(0,0,W,H);
  g.drawImage(blurC,0,0);
  const t=ctx(tmpC);t.setTransform(1,0,0,1,0,0);t.globalCompositeOperation='source-over';t.globalAlpha=1;t.filter='none';t.clearRect(0,0,W,H);
  const m=1+S.magnify/100;t.save();t.translate(W/2,H/2);t.scale(m,m);t.translate(-W/2,-H/2);t.drawImage(cropC,0,0);t.restore();
  t.globalCompositeOperation='destination-in';t.drawImage(maskC,0,0);t.globalCompositeOperation='source-over';g.drawImage(tmpC,0,0);
  if(S.gloss>0){const base=Math.min(W,H)/2;g.save();g.globalCompositeOperation='screen';g.globalAlpha=S.gloss/100*0.8;g.filter=`blur(${base*0.012}px)`;g.strokeStyle='#fff';g.lineWidth=Math.max(2,base*0.016);clearPath(g,1.0);g.stroke();g.restore();}
  overlay()}
function overlay(){const g=ctx(ov);g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);if(!W)return;const sc=W/Math.max(1,wrap.clientWidth);
  g.save();g.setLineDash([6*sc,5*sc]);g.lineWidth=1*sc;g.strokeStyle='rgba(255,255,255,.55)';clearPath(g);g.stroke();g.restore()}
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}

// ---------- panel ----------
function set(k,v){S[k]=v;if(k==='aspect'){recalc();sync();return}sync();schedule()}
const DEF=[
 ['Фото',[{t:'act',l:'файл',b:'Загрузить фото',f:()=>$('file').click()},{t:'meta'}]],
 ['Кроп',[{t:'sel',k:'aspect',l:'формат',o:[['orig','оригинал'],['1x1','1:1'],['4x5','4:5'],['3x4','3:4'],['9x16','9:16'],['16x9','16:9'],['3x2','3:2']]},
   {t:'rng',k:'zoom',l:'зум',min:100,max:400},
   {t:'rng',k:'panx',l:'сдвиг X',min:-100,max:100},
   {t:'rng',k:'pany',l:'сдвиг Y',min:-100,max:100}]],
 ['Эффект краёв',[{t:'sel',k:'shape',l:'зона',o:[['ellipse','эллипс'],['circle','круг'],['rect','прямоугольник']]},
   {t:'rng',k:'clear',l:'чёткий центр',min:5,max:95},
   {t:'rng',k:'feather',l:'переход',min:0,max:100},
   {t:'rng',k:'blur',l:'сила размытия',min:0,max:100},
   {t:'rng',k:'magnify',l:'лупа центра',min:0,max:40},
   {t:'rng',k:'gloss',l:'блик-стекло',min:0,max:100},
   {t:'rng',k:'darken',l:'затемнить края',min:0,max:60}]],
 ['Экспорт',[{t:'sel',k:'fmt',l:'формат',o:[['png','PNG'],['jpg','JPG'],['webp','WebP']]},
   {t:'rng',k:'q',l:'качество',min:40,max:100,dim:()=>S.fmt==='png'},
   {t:'sel',k:'preset',l:'размер',o:[['orig','как есть'],['1080x1080','1080×1080'],['1080x1350','1080×1350'],['1080x1920','1080×1920']]},
   {t:'act',l:'готово',b:'Скачать',f:()=>exportImg()}]]];
const binds=[];let uid=0;
function row(l){const r=document.createElement('div');r.className='r';const s=document.createElement('span');s.textContent=l;r.appendChild(s);return r}
DEF.forEach(([title,items],fi)=>{const f=document.createElement('div');f.className='fold';const h=document.createElement('button');h.className='fh';h.textContent=title;h.setAttribute('aria-expanded','true');
  h.onclick=()=>{f.classList.toggle('closed');h.setAttribute('aria-expanded',String(!f.classList.contains('closed')));fit()};const b=document.createElement('div');b.className='fb';f.append(h,b);pane.appendChild(f);
  items.forEach(it=>{let r;
    if(it.t==='meta'){r=document.createElement('div');r.className='meta';r.id='meta';r.textContent='загрузите фото';b.appendChild(r);return}
    r=row(it.l);b.appendChild(r);const id='c'+(uid++);r.querySelector('span').id=id+'l';
    if(it.t==='act'){const x=document.createElement('button');x.className='b';x.textContent=it.b;x.id=id;x.onclick=it.f;r.appendChild(x)}
    else if(it.t==='rng'){const w=document.createElement('div');w.className='sl';const s=document.createElement('input');s.type='range';s.min=it.min;s.max=it.max;s.step=it.st||1;s.id=id;s.setAttribute('aria-labelledby',id+'l');
      const n=document.createElement('input');n.type='number';n.min=it.min;n.max=it.max;n.step=it.st||1;n.id=id+'n';n.setAttribute('aria-labelledby',id+'l');
      s.oninput=()=>set(it.k,+s.value);n.onchange=()=>set(it.k,clamp(+n.value||0,it.min,it.max));w.append(s,n);r.appendChild(w);
      binds.push(()=>{if(document.activeElement!==s)s.value=S[it.k];if(document.activeElement!==n)n.value=Math.round(S[it.k]);r.classList.toggle('dim',!!(it.dim&&it.dim()))})}
    else if(it.t==='sel'){const s=document.createElement('select');s.id=id;s.setAttribute('aria-labelledby',id+'l');it.o.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o)});s.onchange=()=>set(it.k,s.value);r.appendChild(s);
      binds.push(()=>{s.value=S[it.k];r.classList.toggle('dim',!!(it.dim&&it.dim()))})}
  });
  if(fi>=3&&window.innerWidth<=760)f.classList.add('closed');
});
function sync(){binds.forEach(f=>f());ov.style.cursor='move'}

// ---------- pointer: pan ----------
function imgPt(e){const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
let drag=null;
ov.addEventListener('pointerdown',e=>{if(!W)return;ov.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,px:S.panx,py:S.pany,r:ov.getBoundingClientRect()}});
ov.addEventListener('pointermove',e=>{if(!drag)return;const kx=200/Math.max(1,drag.r.width),ky=200/Math.max(1,drag.r.height);
  S.panx=clamp(drag.px-(e.clientX-drag.x)*kx,-100,100);S.pany=clamp(drag.py-(e.clientY-drag.y)*ky,-100,100);sync();schedule()});
const end=()=>{drag=null};ov.addEventListener('pointerup',end);ov.addEventListener('pointercancel',end);

// ---------- export ----------
function blobOf(c,type,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),type,q))}
async function save(blob,filename){const dl=dlP?await dlP.catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:blob});toast('Сохранено')}catch(e){const c=e&&e.code;toast(c==='declined'?'Отменено':c==='rate_limited'?'Повторите через пару секунд':'Не удалось сохранить')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Скачивание недоступно')}}
async function exportImg(){if(!W){toast('Сначала загрузите фото');return}render();
  let out=view;
  if(S.preset!=='orig'){const [tw,th]=S.preset.split('x').map(Number);const a=tw/th;let cw,ch;if(W/H>a){ch=H;cw=H*a}else{cw=W;ch=W/a}
    const x=(W-cw)/2,y=(H-ch)/2;out=mk();out.width=tw;out.height=th;const g=ctx(out);g.imageSmoothingQuality='high';g.drawImage(view,x,y,cw,ch,0,0,tw,th)}
  if(S.fmt==='jpg'){const fC=mk();fC.width=out.width;fC.height=out.height;const g=ctx(fC);g.fillStyle='#000';g.fillRect(0,0,fC.width,fC.height);g.drawImage(out,0,0);out=fC}
  const type={png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[S.fmt];
  try{await save(await blobOf(out,type,S.q/100),`${fileBase}-edgefocus-${out.width}x${out.height}.${S.fmt}`)}catch(e){toast('Не удалось собрать файл')}}

// first open
setImage(sample(),null);sync();
})();
</script>
</body>
</html>
