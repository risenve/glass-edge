<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Края в фокусе</title>
<style>
/* Dark full-bleed stage; compact tweak panel floats top-right (bottom sheet on phones). */
:root{
  --stage:#0C0C0E; --panel:#2A2A2E; --folder:#232326; --row:#2F2F33; --fg:#C9CAD1; --muted:#8C8D96;
  --ctl:#3A3A3F; --ctl-hi:#45454B; --knob:#B8B9C1; --btn:#ADAFB8; --btn-fg:#1C1C1F; --accent:#91E2FF;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--mono);font-size:12px;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{position:relative}
.wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.stage.dragging::after{content:"";position:absolute;inset:12px;border:1px dashed var(--muted);border-radius:8px;pointer-events:none}

.pane{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;background:var(--panel);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:4px 0 6px;scrollbar-width:thin}
.fold{margin:2px 0}
.fh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--fg);font:inherit;font-size:12.5px;padding:7px 10px;cursor:pointer;text-align:left}
.fh::after{content:"";width:6px;height:10px;border-radius:3px;border:1.5px solid var(--muted);opacity:.8}
.fold.closed .fh::after{height:6px}
.fb{background:var(--folder);padding:3px 0;display:grid}
.fold.closed .fb{display:none}
.r{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;padding:3px 8px 3px 10px;min-height:26px}
.r>span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ctl-hi);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--ctl-hi);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:14px;border-radius:3px;background:var(--knob);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:14px;border-radius:3px;background:var(--knob);border:0}
input[type=number],select{font:inherit;color:var(--fg);background:var(--ctl);border:0;border-radius:3px;height:22px;width:100%;padding:0 6px;box-sizing:border-box}
input[type=number]{text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
select{background:var(--btn);color:var(--btn-fg);font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--btn-fg) 50%),linear-gradient(135deg,var(--btn-fg) 50%,transparent 50%);
  background-position:calc(100% - 12px) 9px,calc(100% - 8px) 9px;background-size:4px 4px;background-repeat:no-repeat;padding-right:22px}
button.b{font:inherit;font-weight:600;color:var(--btn-fg);background:var(--btn);border:0;border-radius:3px;height:22px;padding:0 8px;cursor:pointer;width:100%}
button.b:hover,select:hover{filter:brightness(1.08)}
button.b:active{filter:brightness(.92)}
.ck{width:14px;height:14px;margin:0;accent-color:var(--knob);cursor:pointer}
.r.dim{opacity:.35;pointer-events:none}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.meta{color:var(--muted);padding:2px 10px 4px;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1}
@media (max-width:760px){
  .pane{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46%;border-radius:10px 10px 0 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .stage{bottom:46%}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="wrap" id="wrap"><canvas id="view"></canvas><canvas id="ov"></canvas></div>
</div>
<div class="pane" id="pane"></div>
<input id="file" type="file" accept="image/*" hidden>
<input id="svg" type="file" accept=".svg,image/svg+xml" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const S={aspect:'orig',zoom:100,panx:0,pany:0,
  mode:'overlay',fig:'squircle',figSize:68,
  shape:'ellipse',clear:46,band:46,refract:60,frost:28,gloss:55,chroma:16,tint:10,
  fmt:'png',q:92,preset:'orig'};
const MAXSIDE=3200,OUTLONG=1440;
// default figure (squircle) — embedded from Vector.svg
const SQ_D="M1264.04 155.965C1164.16 56.1018 1028.73 0 887.5 0L710 0L532.5 0C391.269 0 255.837 56.1018 155.963 155.965C56.1096 255.829 0 391.273 0 532.5L0 1242.5C0 1383.73 56.1096 1519.17 155.963 1619.03C255.837 1718.9 391.269 1775 532.5 1775H710H887.5C1028.73 1775 1164.16 1718.9 1264.04 1619.03C1363.89 1519.17 1420 1383.73 1420 1242.5V532.5C1420 391.273 1363.89 255.829 1264.04 155.965Z";
const SQW=1420,SQH=1775,SQP=new Path2D(SQ_D);
const $=id=>document.getElementById(id);
const mk=()=>document.createElement('canvas');
const view=$('view'),ov=$('ov'),wrap=$('wrap'),stage=$('stage'),pane=$('pane');
const srcC=mk(),cropC=mk(),blurC=mk(),tmpC=mk(),figC=mk(),fieldC=mk();
const ctx=c=>c.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let sw=0,sh=0,W=0,H=0,fileBase='photo',customSil=null;
let dlP=null;try{dlP=window.claude&&window.claude.use?window.claude.use('downloads'):null}catch(e){dlP=null}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

// ---------- sample: colorful bookshelf ----------
function sample(){const c=mk();c.width=1600;c.height=1600;const g=ctx(c);g.fillStyle='#2A2018';g.fillRect(0,0,1600,1600);
  const cols=['#7C3B2E','#B5582F','#C79A3A','#4E6B3A','#355E6B','#45386B','#7A3157','#8A8A82','#C2B8A5','#5A4632'];
  const shelfH=1600/5;for(let s=0;s<5;s++){const y0=s*shelfH;g.fillStyle='#3A2C20';g.fillRect(0,y0+shelfH-18,1600,18);
    let x=10;while(x<1590){const w=28+((Math.sin(x*12.9+s*7)*0.5+0.5)*44);const h=shelfH-28-((Math.sin(x*3.1+s)*0.5+0.5)*30);const col=cols[(x*7+s*3|0)%cols.length];
      g.fillStyle=col;g.fillRect(x,y0+shelfH-18-h,w,h);g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x,y0+shelfH-18-h,w,6);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+w-4,y0+shelfH-18-h,4,h);x+=w+5}}
  return c}

// ---------- image io ----------
function recalc(){if(!sw)return;let a;if(S.aspect==='orig')a=sw/sh;else{const [aw,ah]=S.aspect.split('x').map(Number);a=aw/ah}
  if(a>=1){W=OUTLONG;H=Math.round(OUTLONG/a)}else{H=OUTLONG;W=Math.round(OUTLONG*a)}
  for(const c of [cropC,blurC,tmpC,figC,fieldC,view,ov]){c.width=W;c.height=H}
  const m=$('meta');if(m)m.textContent=sw+'×'+sh+'  →  '+W+'×'+H;fit();schedule(true)}
function setImage(img,name){let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const k=Math.min(1,MAXSIDE/Math.max(w,h));sw=Math.round(w*k);sh=Math.round(h*k);
  srcC.width=sw;srcC.height=sh;ctx(srcC).drawImage(img,0,0,sw,sh);if(name)fileBase=name.replace(/\.[^.]+$/,'').slice(0,60)||'photo';recalc()}
function loadFile(f){if(!f||!f.type.startsWith('image/')){toast('Нужен JPG, PNG или WebP');return}
  const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{setImage(im,f.name);URL.revokeObjectURL(url)};im.onerror=()=>toast('Файл не открылся (HEIC → JPG)');im.src=url}
function loadSVG(f){if(!f)return;const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{const s=600,c=mk();c.width=c.height=s;const g=ctx(c);const iw=im.width||300,ih=im.height||300;const k=Math.min(s/iw,s/ih)*0.98;const dw=iw*k,dh=ih*k;
    g.drawImage(im,(s-dw)/2,(s-dh)/2,dw,dh);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,s,s);customSil=c;S.fig='custom';S.mode='overlay';URL.revokeObjectURL(url);sync();schedule(true);toast('SVG — фигура')};
  im.onerror=()=>{URL.revokeObjectURL(url);toast('SVG не открылся')};im.src=url}
$('file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value=''});
$('svg').addEventListener('change',e=>{loadSVG(e.target.files[0]);e.target.value=''});
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('dragging')});
stage.addEventListener('dragleave',()=>stage.classList.remove('dragging'));
stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragging');const f=e.dataTransfer.files[0];if(f&&f.type.includes('svg'))loadSVG(f);else loadFile(f)});
window.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)loadFile(it.getAsFile())});
function fit(){if(!W)return;const r=stage.getBoundingClientRect();const wide=window.innerWidth>760;const padR=wide?pane.offsetWidth+36:16,padL=wide?36:16,padY=wide?36:16;
  const s=Math.min((r.width-padL-padR)/W,(r.height-padY*2)/H);wrap.style.width=Math.max(40,W*s)+'px';wrap.style.height=Math.max(40,H*s)+'px';wrap.style.marginRight=wide?(padR-padL)+'px':'0'}
new ResizeObserver(fit).observe(stage);

// ---------- crop + frost ----------
function buildCrop(){const g=ctx(cropC);g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalAlpha=1;g.clearRect(0,0,W,H);
  const s=Math.max(W/sw,H/sh)*S.zoom/100;const dw=sw*s,dh=sh*s;const ox=(W-dw)/2+S.panx/100*(dw-W)/2,oy=(H-dh)/2+S.pany/100*(dh-H)/2;
  g.imageSmoothingQuality='high';g.drawImage(srcC,ox,oy,dw,dh)}
function buildBlur(){const g=ctx(blurC);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.clearRect(0,0,W,H);g.save();
  const px=Math.max(0.5,S.frost/100*Math.min(W,H)*0.055);g.filter=`blur(${px}px)`;g.drawImage(cropC,0,0);g.restore()}

function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

// ---------- figure ----------
function fillFigure(g){const cx=W/2,cy=H/2,s=S.figSize/100;
  if(S.fig==='circle'){g.beginPath();g.arc(cx,cy,Math.min(W,H)/2*s,0,7);g.fill()}
  else if(S.fig==='ellipse'){g.beginPath();g.ellipse(cx,cy,W/2*s,H/2*s,0,0,7);g.fill()}
  else if(S.fig==='rrect'){const w=W*s,h=H*s;rr(g,cx-w/2,cy-h/2,w,h,Math.min(w,h)*0.14);g.fill()}
  else if(S.fig==='custom'&&customSil){const k=s*Math.min(W,H)/600,dw=600*k,dh=600*k;g.drawImage(customSil,cx-dw/2,cy-dh/2,dw,dh)}
  else{const k=Math.min(W/SQW,H/SQH)*s,dw=SQW*k,dh=SQH*k;g.save();g.translate(cx-dw/2,cy-dh/2);g.scale(k,k);g.fill(SQP);g.restore()}}
function strokeFigure(g,lw){const cx=W/2,cy=H/2,s=S.figSize/100;
  if(S.fig==='circle'){g.beginPath();g.arc(cx,cy,Math.min(W,H)/2*s,0,7);g.stroke()}
  else if(S.fig==='ellipse'){g.beginPath();g.ellipse(cx,cy,W/2*s,H/2*s,0,0,7);g.stroke()}
  else if(S.fig==='rrect'){const w=W*s,h=H*s;rr(g,cx-w/2,cy-h/2,w,h,Math.min(w,h)*0.14);g.stroke()}
  else if(S.fig==='custom'&&customSil){const k=s*Math.min(W,H)/600,dw=600*k,dh=600*k;g.strokeRect(cx-dw/2,cy-dh/2,dw,dh)}
  else{const k=Math.min(W/SQW,H/SQH)*s,dw=SQW*k,dh=SQH*k;g.save();g.translate(cx-dw/2,cy-dh/2);g.scale(k,k);g.lineWidth=lw/k;g.stroke(SQP);g.restore()}}
function bandPx(){return Math.max(1.5,S.band/100*Math.min(W,H)*0.16)}
// exact Euclidean distance (Felzenszwalb) — smooth float field instead of 8-bit blur
let DIST=null;
function edt1(f,n,d,v,z){let k=0;v[0]=0;z[0]=-1e20;z[1]=1e20;
  for(let q=1;q<n;q++){let s;while(true){const r=v[k];s=((f[q]+q*q)-(f[r]+r*r))/(2*q-2*r);if(s<=z[k]){k--;if(k<0){k=0;break}}else break}
    k++;v[k]=q;z[k]=s;z[k+1]=1e20}
  k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const r=v[k];d[q]=(q-r)*(q-r)+f[r]}}
function distInside(mask){const N=W*H,INF=1e20,D=new Float32Array(N);
  for(let i=0;i<N;i++)D[i]=mask[i*4+3]>127?INF:0;
  const n=Math.max(W,H),f=new Float64Array(n),d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1);
  for(let x=0;x<W;x++){for(let y=0;y<H;y++)f[y]=D[y*W+x];edt1(f,H,d,v,z);for(let y=0;y<H;y++)D[y*W+x]=d[y]}
  for(let y=0;y<H;y++){const o=y*W;for(let x=0;x<W;x++)f[x]=D[o+x];edt1(f,W,d,v,z);for(let x=0;x<W;x++)D[o+x]=Math.sqrt(d[x])}
  // soften the ridge a little so normals stay smooth
  const T=new Float32Array(N);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0,c=0;for(let j=-1;j<=1;j++){const yy=y+j;if(yy<0||yy>=H)continue;for(let i=-1;i<=1;i++){const xx=x+i;if(xx<0||xx>=W)continue;s+=D[yy*W+xx];c++}}T[y*W+x]=s/c}
  return T}
function buildFigure(){const g=ctx(figC);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';g.clearRect(0,0,W,H);g.fillStyle='#fff';fillFigure(g);
  DIST=distInside(g.getImageData(0,0,W,H).data)}

// ---------- geometry (non-figure clear zone) ----------
function clearPath(g){const cx=W/2,cy=H/2;
  if(S.shape==='rect'){const w=S.clear/100*W,h=S.clear/100*H,rad=Math.min(w,h)*0.28,x=cx-w/2,y=cy-h/2;
    g.beginPath();g.moveTo(x+rad,y);g.arcTo(x+w,y,x+w,y+h,rad);g.arcTo(x+w,y+h,x,y+h,rad);g.arcTo(x,y+h,x,y,rad);g.arcTo(x,y,x+w,y,rad);g.closePath()}
  else{const base=Math.min(W,H)/2,ax=S.shape==='ellipse'?S.clear/100*W/2:S.clear/100*base,ay=S.shape==='ellipse'?S.clear/100*H/2:S.clear/100*base;
    g.save();g.translate(cx,cy);g.beginPath();g.ellipse(0,0,ax,ay,0,0,7);g.closePath();g.restore()}}

// ---------- glass sampling ----------
function sampleBi(d,x,y){if(x<0)x=0;else if(x>W-1)x=W-1;if(y<0)y=0;else if(y>H-1)y=H-1;
  const x0=x|0,y0=y|0,x1=x0+1<W?x0+1:x0,y1=y0+1<H?y0+1:y0,fx=x-x0,fy=y-y0;
  const i00=(y0*W+x0)*4,i10=(y0*W+x1)*4,i01=(y1*W+x0)*4,i11=(y1*W+x1)*4;
  const w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
  return [d[i00]*w00+d[i10]*w10+d[i01]*w01+d[i11]*w11,d[i00+1]*w00+d[i10+1]*w10+d[i01+1]*w01+d[i11+1]*w11,d[i00+2]*w00+d[i10+2]*w10+d[i01+2]*w01+d[i11+2]*w11]}

// glass to canvas edges, clear central zone (non-figure)
function applyGlassZone(){
  const src=ctx(cropC).getImageData(0,0,W,H).data,frost=ctx(blurC).getImageData(0,0,W,H).data;
  const out=ctx(view).createImageData(W,H),o=out.data;const cx=W/2,cy=H/2,baseR=Math.min(W,H)/2;
  const rectMode=S.shape==='rect';const hw=S.clear/100*W/2,hh=S.clear/100*H/2,rad=Math.min(hw,hh)*0.28,refR=Math.min(hw,hh);
  const ax=S.shape==='ellipse'?S.clear/100*W/2:S.clear/100*baseR,ay=S.shape==='ellipse'?S.clear/100*H/2:S.clear/100*baseR;
  const Lf=0.10+S.band/100*0.6,amp=S.refract/100*baseR*0.16,chroma=S.chroma/100*0.5,lx=-0.55,ly=-0.83;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;let f,nxp,nyp;
    if(rectMode){const qx=Math.abs(x-cx)-(hw-rad),qy=Math.abs(y-cy)-(hh-rad),ex=Math.max(qx,0),ey=Math.max(qy,0);const dist=Math.hypot(ex,ey)+Math.min(Math.max(qx,qy),0)-rad;f=1+dist/refR;
      nxp=Math.sign(x-cx)*(ex||(qx>qy?1:0));nyp=Math.sign(y-cy)*(ey||(qy>=qx?1:0));const nl=Math.hypot(nxp,nyp)||1;nxp/=nl;nyp/=nl}
    else{const dx=(x-cx)/ax,dy=(y-cy)/ay;f=Math.hypot(dx,dy);let gx=(x-cx)/(ax*ax),gy=(y-cy)/(ay*ay);const gl=Math.hypot(gx,gy)||1;nxp=gx/gl;nyp=gy/gl}
    if(f<1){o[i]=src[i];o[i+1]=src[i+1];o[i+2]=src[i+2];o[i+3]=255;continue}
    const u=f-1,tl=Math.min(u/Lf,1),prof=Math.sin(Math.PI*tl)*(1-tl*0.25),d=amp*prof;let cr,cg,cb;
    if(chroma>0){const rr=sampleBi(src,x-nxp*d*(1+chroma),y-nyp*d*(1+chroma)),gg=sampleBi(src,x-nxp*d,y-nyp*d),bb=sampleBi(src,x-nxp*d*(1-chroma),y-nyp*d*(1-chroma));cr=rr[0];cg=gg[1];cb=bb[2]}
    else{const c=sampleBi(src,x-nxp*d,y-nyp*d);cr=c[0];cg=c[1];cb=c[2]}
    if(u>Lf){const fb=sampleBi(frost,x,y),mixp=Math.min((u-Lf)/(Lf*1.1),1);cr+=(fb[0]-cr)*mixp;cg+=(fb[1]-cg)*mixp;cb+=(fb[2]-cb)*mixp}
    const tn=S.tint/100*0.5*Math.min(1,u/Lf);cr+=(206-cr)*tn*0.25;cg+=(224-cg)*tn*0.25;cb+=(255-cb)*tn*0.25;
    const spec=Math.pow(Math.max(0,nxp*lx+nyp*ly),1.5)*Math.max(0,1-Math.abs(tl-0.5)*2)*(S.gloss/100);cr+=(255-cr)*spec;cg+=(255-cg)*spec;cb+=(255-cb)*spec;
    const rim=Math.max(0,1-u/(Lf*0.22))*0.55*(S.gloss/100);cr+=(255-cr)*rim;cg+=(255-cg)*rim;cb+=(255-cb)*rim;
    o[i]=cr;o[i+1]=cg;o[i+2]=cb;o[i+3]=255}
  ctx(view).putImageData(out,0,0)}

// glass FIGURE sitting on top of the full photo (liquid-glass window)
function applyGlassOverlay(){
  const g=ctx(view);g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalAlpha=1;g.clearRect(0,0,W,H);g.drawImage(cropC,0,0);
  const src=ctx(cropC).getImageData(0,0,W,H).data,frost=ctx(blurC).getImageData(0,0,W,H).data;
  const mask=ctx(figC).getImageData(0,0,W,H).data;
  const lay=ctx(tmpC).createImageData(W,H),o=lay.data;
  const cx=W/2,cy=H/2,R=bandPx(),amp=S.refract/100*R*1.15,mag=S.refract/100*0.05,chroma=S.chroma/100*0.5,lx=-0.55,ly=-0.83,L=0.9;
  const fa=(x,y)=>DIST[(y<0?0:y>H-1?H-1:y)*W+(x<0?0:x>W-1?W-1:x)];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;const ma=mask[i+3];if(ma===0){o[i+3]=0;continue}
    const dd=DIST[y*W+x],a=dd/R;
    let gx=fa(x+2,y)-fa(x-2,y),gy=fa(x,y+2)-fa(x,y-2);const gn=Math.hypot(gx,gy)||1;const inx=gx/gn,iny=gy/gn;// inward normal from exact distance
    const tt=Math.min(a,1),t=tt*tt*(3-2*tt),kk=1+S.refract/100*1.6,d=tt<1?R*(1-Math.pow(1-tt,kk))-dd:0;// monotonic remap: edge pulls image from deeper inside, never folds
    const sxb=cx+(x-cx)*(1-mag),syb=cy+(y-cy)*(1-mag);let cr,cg,cb;
    if(chroma>0){const rr=sampleBi(src,sxb+inx*d*(1+chroma),syb+iny*d*(1+chroma)),gg=sampleBi(src,sxb+inx*d,syb+iny*d),bb=sampleBi(src,sxb+inx*d*(1-chroma),syb+iny*d*(1-chroma));cr=rr[0];cg=gg[1];cb=bb[2]}
    else{const c=sampleBi(src,sxb+inx*d,syb+iny*d);cr=c[0];cg=c[1];cb=c[2]}
    const mixp=S.frost/100*0.6,fb=sampleBi(frost,sxb,syb);cr+=(fb[0]-cr)*mixp;cg+=(fb[1]-cg)*mixp;cb+=(fb[2]-cb)*mixp;
    const tn=S.tint/100*0.22;cr+=(206-cr)*tn;cg+=(224-cg)*tn;cb+=(255-cb)*tn;
    const spec=Math.pow(Math.max(0,-inx*lx-iny*ly),1.5)*Math.max(0,1-Math.abs(t-0.5)*2)*(S.gloss/100);cr+=(255-cr)*spec;cg+=(255-cg)*spec;cb+=(255-cb)*spec;
    const rim=Math.max(0,1-t/0.18)*0.6*(S.gloss/100);cr+=(255-cr)*rim;cg+=(255-cg)*rim;cb+=(255-cb)*rim;
    o[i]=cr;o[i+1]=cg;o[i+2]=cb;o[i+3]=ma}
  ctx(tmpC).putImageData(lay,0,0);g.drawImage(tmpC,0,0)}

function render(full){if(!W)return;buildCrop();
  if(full){buildBlur();if(S.mode==='overlay'){buildFigure();applyGlassOverlay()}else applyGlassZone()}
  else{const g=ctx(view);g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalAlpha=1;g.clearRect(0,0,W,H);g.drawImage(cropC,0,0)}
  overlay()}
function overlay(){const g=ctx(ov);g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);if(!W)return;const sc=W/Math.max(1,wrap.clientWidth);
  g.save();g.setLineDash([6*sc,5*sc]);g.lineWidth=1*sc;g.strokeStyle='rgba(255,255,255,.5)';if(S.mode==='overlay')strokeFigure(g,1*sc);else{clearPath(g);g.stroke()}g.restore()}
let raf=0,pendFull=false;
function schedule(full){if(full)pendFull=true;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const f=pendFull;pendFull=false;render(f)})}

// ---------- panel ----------
function set(k,v){S[k]=v;if(k==='aspect'){recalc();sync();return}sync();schedule(true)}
const DEF=[
 ['Фото',[{t:'act',l:'файл',b:'Загрузить фото',f:()=>$('file').click()},{t:'meta'}]],
 ['Кроп',[{t:'sel',k:'aspect',l:'формат',o:[['orig','оригинал'],['1x1','1:1'],['4x5','4:5'],['3x4','3:4'],['9x16','9:16'],['16x9','16:9'],['3x2','3:2']]},
   {t:'rng',k:'zoom',l:'зум',min:100,max:400},
   {t:'rng',k:'panx',l:'сдвиг X',min:-100,max:100},
   {t:'rng',k:'pany',l:'сдвиг Y',min:-100,max:100}]],
 ['Вариант',[{t:'sel',k:'mode',l:'эффект',o:[['overlay','фигура-стекло над фото'],['edges','стекло по краям фото']]}]],
 ['Фигура-окно',[{t:'sel',k:'fig',l:'фигура',o:[['squircle','скруглённая'],['rrect','прямоугольник'],['circle','круг'],['ellipse','овал'],['custom','свой SVG']],dim:()=>S.mode!=='overlay'},
   {t:'act',l:'свой SVG',b:'Загрузить SVG',f:()=>$('svg').click()},
   {t:'rng',k:'figSize',l:'размер окна',min:25,max:100,dim:()=>S.mode!=='overlay'}]],
 ['Стекло',[{t:'sel',k:'shape',l:'зона (по краям)',o:[['ellipse','эллипс'],['circle','круг'],['rect','прямоугольник']],dim:()=>S.mode!=='edges'},
   {t:'rng',k:'clear',l:'чёткий центр',min:5,max:92,dim:()=>S.mode!=='edges'},
   {t:'rng',k:'band',l:'толщина стекла',min:5,max:100},
   {t:'rng',k:'refract',l:'преломление',min:0,max:100},
   {t:'rng',k:'frost',l:'матовость',min:0,max:100},
   {t:'rng',k:'gloss',l:'блик',min:0,max:100},
   {t:'rng',k:'chroma',l:'хроматика',min:0,max:100},
   {t:'rng',k:'tint',l:'оттенок',min:0,max:100}]],
 ['Экспорт',[{t:'sel',k:'fmt',l:'формат',o:[['png','PNG (прозрачность)'],['jpg','JPG'],['webp','WebP']]},
   {t:'rng',k:'q',l:'качество',min:40,max:100,dim:()=>S.fmt==='png'},
   {t:'sel',k:'preset',l:'размер',o:[['orig','как есть'],['1080x1080','1080×1080'],['1080x1350','1080×1350'],['1080x1920','1080×1920']]},
   {t:'act',l:'готово',b:'Скачать',f:()=>exportImg()}]]];
const binds=[];let uid=0;
function row(l){const r=document.createElement('div');r.className='r';const s=document.createElement('span');s.textContent=l;r.appendChild(s);return r}
DEF.forEach(([title,items],fi)=>{const f=document.createElement('div');f.className='fold';const h=document.createElement('button');h.className='fh';h.textContent=title;h.setAttribute('aria-expanded','true');
  h.onclick=()=>{f.classList.toggle('closed');h.setAttribute('aria-expanded',String(!f.classList.contains('closed')));fit()};const b=document.createElement('div');b.className='fb';f.append(h,b);pane.appendChild(f);
  items.forEach(it=>{let r;
    if(it.t==='meta'){r=document.createElement('div');r.className='meta';r.id='meta';r.textContent='загрузите фото';b.appendChild(r);return}
    r=row(it.l);b.appendChild(r);const id='c'+(uid++);r.querySelector('span').id=id+'l';
    if(it.t==='act'){const x=document.createElement('button');x.className='b';x.textContent=it.b;x.id=id;x.onclick=it.f;r.appendChild(x)}
    else if(it.t==='chk'){const c=document.createElement('input');c.type='checkbox';c.className='ck';c.id=id;c.setAttribute('aria-labelledby',id+'l');c.onchange=()=>set(it.k,c.checked);r.appendChild(c);binds.push(()=>{c.checked=!!S[it.k]})}
    else if(it.t==='rng'){const w=document.createElement('div');w.className='sl';const s=document.createElement('input');s.type='range';s.min=it.min;s.max=it.max;s.step=it.st||1;s.id=id;s.setAttribute('aria-labelledby',id+'l');
      const n=document.createElement('input');n.type='number';n.min=it.min;n.max=it.max;n.step=it.st||1;n.id=id+'n';n.setAttribute('aria-labelledby',id+'l');
      s.oninput=()=>set(it.k,+s.value);n.onchange=()=>set(it.k,clamp(+n.value||0,it.min,it.max));w.append(s,n);r.appendChild(w);
      binds.push(()=>{if(document.activeElement!==s)s.value=S[it.k];if(document.activeElement!==n)n.value=Math.round(S[it.k]);r.classList.toggle('dim',!!(it.dim&&it.dim()))})}
    else if(it.t==='sel'){const s=document.createElement('select');s.id=id;s.setAttribute('aria-labelledby',id+'l');it.o.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o)});s.onchange=()=>set(it.k,s.value);r.appendChild(s);
      binds.push(()=>{s.value=S[it.k];r.classList.toggle('dim',!!(it.dim&&it.dim()))})}
  });
  if(fi>=4&&window.innerWidth<=760)f.classList.add('closed');
});
function sync(){binds.forEach(f=>f());ov.style.cursor='move'}

// ---------- pointer: pan ----------
let drag=null;
ov.addEventListener('pointerdown',e=>{if(!W)return;ov.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,px:S.panx,py:S.pany,r:ov.getBoundingClientRect()}});
ov.addEventListener('pointermove',e=>{if(!drag)return;const kx=200/Math.max(1,drag.r.width),ky=200/Math.max(1,drag.r.height);
  S.panx=clamp(drag.px-(e.clientX-drag.x)*kx,-100,100);S.pany=clamp(drag.py-(e.clientY-drag.y)*ky,-100,100);sync();schedule(false)});
const end=()=>{if(drag){drag=null;schedule(true)}};ov.addEventListener('pointerup',end);ov.addEventListener('pointercancel',end);

// ---------- export ----------
function blobOf(c,type,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),type,q))}
async function save(blob,filename){const dl=dlP?await dlP.catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:blob});toast('Сохранено')}catch(e){const c=e&&e.code;toast(c==='declined'?'Отменено':c==='rate_limited'?'Повторите через пару секунд':'Не удалось сохранить')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Скачивание недоступно')}}
async function exportImg(){if(!W){toast('Сначала загрузите фото');return}render(true);
  let out=view;
  if(S.preset!=='orig'){const [tw,th]=S.preset.split('x').map(Number);const a=tw/th;let cw,ch;if(W/H>a){ch=H;cw=H*a}else{cw=W;ch=W/a}
    const x=(W-cw)/2,y=(H-ch)/2;out=mk();out.width=tw;out.height=th;const g=ctx(out);g.imageSmoothingQuality='high';g.drawImage(view,x,y,cw,ch,0,0,tw,th)}
  if(S.fmt==='jpg'){const fC=mk();fC.width=out.width;fC.height=out.height;const g=ctx(fC);g.fillStyle='#000';g.fillRect(0,0,fC.width,fC.height);g.drawImage(out,0,0);out=fC}
  const type={png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[S.fmt];
  try{await save(await blobOf(out,type,S.q/100),`${fileBase}-glassedge-${out.width}x${out.height}.${S.fmt}`)}catch(e){toast('Не удалось собрать файл')}}

// first open
setImage(sample(),null);sync();
})();
